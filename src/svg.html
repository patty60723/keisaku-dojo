    <svg id="stage" viewBox="0 0 400 280" role="img" aria-label="禪堂裡,一顆麻糬坐在蒲團上打坐,一位住持拿著香板來回巡堂">

        <radialGradient id="andonGlow">

          <stop offset=".55" stop-color="#ffb066" stop-opacity=".08"/>

          <stop offset="1" stop-color="#f8d39a"/>
        </linearGradient>
        <radialGradient id="sunGlow">
          <stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/>
          <stop offset=".45" stop-color="#ff9d52" stop-opacity=".45"/>
          <stop offset="1" stop-color="#ff8a4a" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="duskWash" x1="0" y1="0" x2="1" y2=".4">
          <stop offset="0" stop-color="#ff9a4a" stop-opacity=".26"/>
          <stop offset="1" stop-color="#e8743a" stop-opacity=".14"/>

        <clipPath id="moonPool"><ellipse cx="116" cy="248" rx="60" ry="17"/></clipPath>

      </defs>

      <!-- wall & woodwork -->
      <rect class="f-wall" x="0" y="0" width="400" height="176"/>

      <rect class="f-wood2" x="0" y="34" width="400" height="7"/>
      <rect class="f-wood" x="12" y="0" width="10" height="176"/>
      <rect class="f-wood" x="378" y="0" width="10" height="176"/>

      <!-- round window -->

        <circle cx="94" cy="111" r="24" fill="url(#sunGlow)"/><circle cx="94" cy="111" r="10.5" fill="#e8553a"/>
      </g>
      <g id="winView" clip-path="url(#winClip)"></g>   <!-- the season outside, drawn by the script -->

        <line x1="282" y1="82" x2="346" y2="82"/><line x1="282" y1="98" x2="346" y2="98"/><line x1="282" y1="114" x2="346" y2="114"/>
      </g>
      <rect class="s-wood" x="282" y="66" width="64" height="64" fill="none" stroke-width="5"/>

      <g id="rulesBoard">
        <path d="M38 42 L29 55 M38 42 L47 55" stroke="#2a2622" stroke-width=".7" fill="none"/>
        <circle cx="38" cy="42" r="1.4" class="f-wood"/>
        <rect class="f-stick" x="27" y="55" width="22" height="58" rx="1.5" stroke="#5d4230" stroke-width="1.2"/>

        <text class="scroll-char f-sink" x="38" y="96" font-size="12" text-anchor="middle">規</text>
      </g>

      <!-- hanging scroll -->

      <rect class="f-mount" x="180" y="50" width="40" height="92"/>
      <rect class="f-paper" x="185" y="58" width="30" height="76"/>

      <rect class="f-wood" x="174" y="141" width="52" height="5" rx="2.5"/>

      <!-- incense table (doubles as the timer), between the round window and the scroll, so the left wall carries
           as much as the right (square window, andon, ledger); tea waits on it at break time -->
      <g id="incenseTable" transform="translate(-192 0)">
      <rect class="f-wood" x="312" y="152" width="52" height="5" rx="1"/>
      <rect class="f-wood" x="316" y="157" width="4" height="17"/>
      <rect class="f-wood" x="356" y="157" width="4" height="17"/>
      <path class="f-wood2" d="M326 140 h24 q-1 12 -12 12 q-11 0 -12 -12 z"/>

      </g>
      </g>

        <path d="M383 42 L374 57 M383 42 L392 57" stroke="#2a2622" stroke-width=".7" fill="none"/>
        <circle cx="383" cy="42" r="1.4" class="f-wood2"/>
        <rect class="f-paper" x="371" y="57" width="24" height="62" rx="1" stroke="#2a2622" stroke-width=".8"/>
        <rect class="f-wood2" x="371" y="57" width="24" height="5"/>
        <rect x="377" y="66" width="12" height="44" fill="#fffdf6" stroke="#2a2622" stroke-width=".5"/>
        <text class="scroll-char f-sink" x="383" y="77" font-size="9.5" text-anchor="middle">坐</text>
        <text class="scroll-char f-sink" x="383" y="90" font-size="9.5" text-anchor="middle">禪</text>
        <text class="scroll-char f-sink" x="383" y="103" font-size="9.5" text-anchor="middle">帳</text>
      </g>

      <!-- floor -->
      <rect x="0" y="176" width="400" height="104" class="f-tatami"/>
      <rect x="0" y="176" width="400" height="104" fill="url(#weave)"/>
      <rect class="f-wood" x="0" y="170" width="400" height="7"/>
      <rect class="f-heri" x="0" y="230" width="400" height="3"/>
      <rect class="f-heri" x="128" y="177" width="3" height="53"/>
      <rect class="f-heri" x="272" y="233" width="3" height="47"/>

      <!-- night: moonlight falls from both windows; an andon (paper floor lantern) glows under the square one -->
      <g class="night" id="nightLights">
        <!-- each window's moonlight lying on the tatami, faint and soft-edged, with its lattice's shadow in it.
             One moon lights both: each patch lands the same 30 units right of its window. -->
        <g class="beam"><g filter="url(#softer)" style="mix-blend-mode: screen">
          <ellipse cx="116" cy="248" rx="74" ry="22" fill="url(#moonGlow)"/>
          <path d="M306 234 H382 L392 262 H296 Z" fill="#9fb8e8" opacity=".28"/>
        </g>

            <line x1="96" y1="228" x2="92" y2="268"/><line x1="116" y1="228" x2="116" y2="268"/><line x1="136" y1="228" x2="140" y2="268"/>
            <line x1="52" y1="242" x2="180" y2="242"/><line x1="52" y1="254" x2="180" y2="254"/>

          </g>
        </g>
      </g>

      <!-- the andon itself stands there day and night; only at night is its paper lit.

      <g id="andon" transform="translate(272 16)">
        <rect class="f-wood" x="30" y="176" width="2" height="10"/>
        <rect class="f-wood" x="46" y="176" width="2" height="10"/>
        <rect x="29" y="153" width="20" height="25" fill="#efe6cf" stroke="#5d4230" stroke-width=".8"/>
        <rect class="night" id="andonPaperLit" x="29" y="153" width="20" height="25" fill="url(#andonPaper)" stroke="#5d4230" stroke-width=".8"/>
        <path d="M39 153 V178 M29 161.3 H49 M29 169.6 H49" stroke="#5d4230" stroke-width=".55" opacity=".55"/>
        <rect class="f-wood" x="27" y="150" width="24" height="3" rx="1"/>
        <rect class="f-wood" x="27" y="178" width="24" height="3" rx="1"/>

      <!-- the keisaku's place: leaning against the right-hand post until the monk picks it up -->
      <g id="rackStick" transform="translate(375 176) rotate(4)">
        <rect class="f-stick" x="-1.4" y="-58" width="2.8" height="58" rx="1.2" stroke="#2a2622" stroke-width=".8"/>
        <rect class="f-stick" x="-2.8" y="-76" width="5.6" height="22" rx="1.8" stroke="#2a2622" stroke-width=".8"/>
      </g>

      <!-- monk (drawn behind the sitter; feet at 0,0, facing right) -->
      <g id="monk" data-mood="calm" transform="translate(90 215)">
        <!-- drawn in a consistent three-quarter view facing right (flipped with scale(-1,1) to face left) -->
        <ellipse class="f-sink m-foot" cx="-6" cy="1" rx="6" ry="2.5"/>   <!-- the feet take turns stepping while he walks -->
        <ellipse class="f-sink m-foot" cx="9" cy="1" rx="6" ry="2.5"/>
        <!-- far sleeve: the wide kimono sleeve of the arm on the other side, hanging behind the body -->
        <path class="f-robe" d="M-12.5 -53.5 C-17.4 -51.6 -19.6 -46.4 -20 -38.6 L-20.6 -25.6 Q-16.8 -22.8 -12.4 -24.6 Z" stroke="#2a2622" stroke-width="1.3" stroke-linejoin="round"/>
        <path class="f-skin" d="M-3.6 -61 h7.6 v5.5 h-7.6 z"/>   <!-- neck -->
        <!-- the robe: rounded shoulders, a little flare, the hem dipping slightly in the middle -->
        <path class="f-robe" d="M-16.6 0 C-17.4 -17 -16.6 -37 -14.6 -49.6 Q-13.2 -57.6 -5.2 -58.6 L6.2 -58.6 Q14.6 -57.6 16.2 -49.6 C17.8 -36 19.6 -18 20.6 0 Q2 2 -16.6 0 Z" stroke="#2a2622" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M-6 -30 Q-5 -15 -7.2 -2.4 M7.8 -22 Q9.2 -11 8.6 -1.6" class="s-ink" stroke-width=".9" stroke-linecap="round" opacity=".28"/>   <!-- folds -->
        <!-- kimono collar, crossed toward the side he faces: the white under-collar, then the robe's own collar band -->
        <path d="M-5 -58.4 L6 -41 L9.6 -57.8" fill="#f3efe4" stroke="#2a2622" stroke-width="1.1" stroke-linejoin="round"/>
        <path d="M-6.6 -58.2 L5.2 -40.4 M11.2 -57.4 L7.4 -42.6" stroke="#22314f" stroke-width="2.6" stroke-linecap="round"/>
        <!-- rakusu hung from the neck -->
        <g class="rakusu">
          <path d="M-4.5 -57 L-6.5 -43 M10.5 -56.5 L13 -43" stroke="var(--kesa)" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="-5.6" cy="-49" r="1.7" fill="none" stroke="#e9dcc0" stroke-width="1"/>
          <rect class="f-kesa" x="-8" y="-44" width="22" height="15" rx="1.2" stroke="#2a2622" stroke-width="1"/>
          <rect x="-5.6" y="-41.6" width="17.2" height="10.2" rx=".6" fill="none" stroke="#2a2622" stroke-width=".7" opacity=".35"/>
        </g>
        <!-- near sleeve: the forearm reaches forward to hold the stick and the wide sleeve drapes below it -->
        <path class="f-robe" d="M6.4 -57.2 Q12.4 -59.6 16.2 -55 Q19.8 -50 20.6 -42 L21.8 -28.6 Q17.6 -25.4 11.6 -27.4 Q9.6 -30.6 9.2 -34.4 Q6 -45 6.4 -57.2 Z" stroke="#2a2622" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M12.6 -30.4 Q16.6 -29.6 20.2 -31.6" class="s-ink" stroke-width=".8" opacity=".3" stroke-linecap="round"/>
        <circle class="f-skin" cx="12" cy="-38" r="4.2" stroke="#2a2622" stroke-width="1.1"/>
        <circle class="f-skin" cx="-13" cy="-72" r="3.4" stroke="#2a2622" stroke-width="1.1"/>

        <path d="M-6 -84 q4 -2 8 0" class="s-ink" stroke-width=".8" opacity=".35"/>
        <ellipse cx="3" cy="-73" rx="1.6" ry="2" fill="#2a2622"/>
        <ellipse cx="10" cy="-73" rx="1.6" ry="2" fill="#2a2622"/>
        <ellipse class="f-blush" cx="-2" cy="-66.5" rx="3.2" ry="1.9" opacity=".7"/>

        <path class="m-stern-mouth s-ink" d="M4 -65.5 h5" stroke-width="1.3" stroke-linecap="round"/>
        <path class="brow s-ink" d="M0 -79 l5 2.2 M13 -79 l-4.5 2.2" stroke-width="1.5" stroke-linecap="round"/>

      <!-- the keisaku: its own layer that follows the monk; lifted above the mochi while he strikes -->

        </g>
      </g>

      <!-- sitter: a mochi on a zafu -->
      <g id="sitter" class="standing" data-face="peek" transform="translate(200 240)">
        <rect class="f-mat" x="-48" y="-5" width="96" height="11" rx="3"/>
        <ellipse class="f-cushion" cx="0" cy="-8" rx="36" ry="10" stroke="#2a2622" stroke-width="1.3"/>
        <g id="accCushion"></g>   <!-- the lap blanket, folded here while the mochi stands -->
        <g id="accSide" transform="translate(6 0)"></g>   <!-- a tea bowl, a fan, a cat… on the mat beside the cushion -->
        <!-- the mochi stands beside the cushion while checking in, and hops on to sit -->
        <g id="mochi" transform="translate(-66 14)">
        <g class="feet">
          <ellipse class="f-mochi" cx="-11" cy="-10" rx="8" ry="4" stroke="#2a2622" stroke-width="1.3"/>
          <ellipse class="f-mochi" cx="11" cy="-10" rx="8" ry="4" stroke="#2a2622" stroke-width="1.3"/>
        </g>
        <g id="sitterBody">
          <g class="side-arms">
            <ellipse class="f-mochi" cx="-32" cy="-31" rx="5" ry="7" transform="rotate(28 -32 -31)" stroke="#2a2622" stroke-width="1.3"/>
            <ellipse class="f-mochi" cx="32" cy="-31" rx="5" ry="7" transform="rotate(-28 32 -31)" stroke="#2a2622" stroke-width="1.3"/>
          </g>
          <path class="f-mochi" d="M-31 -14 C-34 -40 -20 -68 0 -68 C20 -68 34 -40 31 -14 C22 -9 -22 -9 -31 -14 Z" stroke="#2a2622" stroke-width="1.6"/>
          <ellipse class="f-blush" cx="-17" cy="-36" rx="4.5" ry="2.8" opacity=".75"/>
          <ellipse class="f-blush" cx="17" cy="-36" rx="4.5" ry="2.8" opacity=".75"/>
          <g id="mochiAccBack"></g>   <!-- worn under the arms: the hands stay in front of a scarf or a sash -->
          <!-- sitting: the arms curve down the body to the lap, where the hands make the zazen mudra
               (right hand resting in the left, thumb tips just touching). In a robe the arms take its colour. -->
          <g class="lap-hands">
            <!-- each arm leaves the body's own outline at the side and curves in to the lap -->
            <g class="arm" style="fill: var(--sleeve, var(--mochi))">
              <path d="M-30.8 -29.6 C-29.8 -23.6 -22.4 -19.6 -11.8 -18.2 L-11 -22.2 C-18.8 -23.4 -23 -26.6 -24.6 -30.6 Z"/>
              <path d="M30.8 -29.6 C29.8 -23.6 22.4 -19.6 11.8 -18.2 L11 -22.2 C18.8 -23.4 23 -26.6 24.6 -30.6 Z"/>
            </g>
            <path class="s-ink" stroke-width="1.3" stroke-linecap="round" fill="none"
                  d="M-30.8 -29.6 C-29.8 -23.6 -22.4 -19.6 -11.8 -18.2 M-11 -22.2 C-18.8 -23.4 -23 -26.6 -24.6 -30.6
                     M30.8 -29.6 C29.8 -23.6 22.4 -19.6 11.8 -18.2 M11 -22.2 C18.8 -23.4 23 -26.6 24.6 -30.6"/>
            <!-- two round little hands meeting in the lap, the right one just over the left -->
            <ellipse class="f-mochi" cx="-5.6" cy="-19" rx="6.6" ry="4.6" stroke="#2a2622" stroke-width="1.3"/>
            <ellipse class="f-mochi" cx="5.6" cy="-19.4" rx="6.6" ry="4.6" stroke="#2a2622" stroke-width="1.3"/>
            <path d="M3.6 -22.6 q1.6 -.8 3.4 -.2" class="s-ink" stroke-width=".9" stroke-linecap="round" opacity=".5"/>
          </g>
          <!-- faces. Parts marked data-a move a little while their face shows (driven from the script, see animateFace):
               blink, bob, glance, float, drip, twinkle, pulse, shake, yawn, fade, seq -->
          <g class="face f-calm s-ink" stroke-width="1.5" stroke-linecap="round">
            <g data-a="bob" data-amp=".5" data-per="5"><path d="M-13 -44 q4 3.2 8 0"/><path d="M5 -44 q4 3.2 8 0"/></g><path d="M-2 -35 q2 1.4 4 0"/>
          </g>
          <g class="face f-ouch s-ink" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <g data-a="shake"><path d="M-14 -48 l7 3 l-7 3"/><path d="M14 -48 l-7 3 l7 3"/><path d="M-5 -34 q2.5 -2.4 5 0 q2.5 2.4 5 0"/></g>
            
          </g>
          <g class="face f-happy s-ink" stroke-width="1.5" stroke-linecap="round">
            <g data-a="bob" data-amp="1.2" data-per="1.1"><path d="M-13 -42 q4 -4 8 0"/><path d="M5 -42 q4 -4 8 0"/></g><path d="M-4 -36 q4 4 8 0"/>
          </g>
          <g class="face f-peek" stroke-linecap="round">
            <g data-a="blink glance"><circle cx="-9" cy="-43" r="2" fill="#2a2622"/><circle cx="9" cy="-43" r="2" fill="#2a2622"/></g>
            <path class="s-ink" d="M-2 -35 h4" stroke-width="1.5"/>
          </g>
          <!-- faces collected in the 收藏冊: each turns up at its own moment -->
          <g class="face f-sleepy s-ink" stroke-width="1.5" stroke-linecap="round">
            <path d="M-13 -44 q4 1.8 8 .6 M5 -43.4 q4 1.2 8 -.6"/><ellipse data-a="yawn" cx="0" cy="-34.4" rx="2.1" ry="2.7" fill="#5a3430" stroke-width="1.2"/>
            
            
          </g>
          <g class="face f-proud s-ink" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <g data-a="bob" data-amp=".8" data-per="1.6"><path d="M-13 -42 l4 -3.4 l4 3.4 M5 -42 l4 -3.4 l4 3.4"/></g><path d="M-3.5 -35.8 q3.8 3 7.6 -.9"/>
            
          </g>
